 const yrs=[...new Set([td().slice(0,4),...Object.values(items).map(v=>v&&v.date&&String(v.date).slice(0,4)).filter(Boolean),...bills.map(b=>b.dt.slice(0,4))])].sort().reverse();
 const f=t=>rec(t).filter(v=>iy(v.date)),di=f('diary'),ph=f('photo'),fo=f('food').filter(v=>v.kind==='吃过'),le=f('letter'),ev=f('event'),mo=f('mood'),fi=f('fight'),pl=rec('plan').filter(v=>iy(v.date)&&v.done);
 const B=bills.filter(b=>iy(b.dt)),ex=B.filter(b=>b.kind==='支出'),F=[];
 const fr=(ic,big,t,s)=>F.push(`<div class="card static" style="text-align:center;border:2px solid var(--ink)"><span class="stamp">第 ${F.length+1} 帧</span><div style="font-size:30px;margin-top:6px">${ic}</div><div class="big" style="font-size:42px">${big}</div><div>${t}</div><div class="mut">${s||''}</div></div>`);
 const end=Y===td().slice(0,4)?td():Y+'-12-31',dn=dayN(end);
 if(dn>0)fr('🎞️',dn,'天 · 一起走过','截至 '+end);
 if(di.length){const L=[...di].sort((a,b)=>(b.text||'').length-(a.text||'').length)[0];fr('📖',di.length,'篇日记','最长的一篇：'+esc(title(L)))}
 if(ph.length){const ad=ph.filter(v=>v.ad);fr('📷',ph.length,'张照片足迹',`点亮 ${new Set(ad.map(v=>v.ad.slice(0,2))).size} 个省 · ${new Set(ad.map(v=>v.ad.slice(0,4))).size} 个市`)}
 if(fo.length){const t=[...fo].sort((a,b)=>(b.star||'').length-(a.star||'').length)[0];fr('😋',fo.length,'家一起吃过的店',t&&t.star?'最爱：'+esc(t.name)+' '+esc(t.star):'')}
 if(le.length||ev.length||pl.length)fr('💌',le.length,'封情话','还有 '+ev.length+' 件大事记、'+pl.length+' 个完成的约会/心愿');
 if(mo.length)fr('🌤️',mo.filter(v=>v.score>=4).length,'个好心情的日子',who().map(n=>{const p=mo.filter(v=>v.by===n);return p.length?esc(n)+' 平均 '+MO[Math.round(p.reduce((t,v)=>t+v.score,0)/p.length)]:''}).filter(Boolean).join('　'));
 if(fi.length)fr('🩹',fi.length,'次吵架复盘','吵架不可怕，复盘就是成长');
 if(ex.length){const c={},m={};ex.forEach(b=>{c[b.cat]=(c[b.cat]||0)+Number(b.amt);m[b.dt.slice(5,7)]=(m[b.dt.slice(5,7)]||0)+Number(b.amt)});const tc=Object.entries(c).sort((a,b)=>b[1]-a[1])[0],tm=Object.entries(m).sort((a,b)=>b[1]-a[1])[0],bg=[...ex].sort((a,b)=>b.amt-a.amt)[0];
  fr('💰','¥'+sum(ex,'支出').toFixed(0),'这一年的支出',`最多花在 ${icon(tc[0],'支出')}${esc(tc[0])}（¥${tc[1].toFixed(0)}）· ${+tm[0]}月花得最多 · 最大一笔 ¥${Number(bg.amt).toFixed(0)} ${esc(bg.note||bg.cat)}`);
  const sh=sum(ex.filter(b=>b.shared),'支出');if(sh>0)fr('🤝','¥'+sh.toFixed(0),'是我们一起花的','占全部支出 '+(sh/sum(ex,'支出')*100).toFixed(0)+'%')}
 const dep=rec('dep').filter(d=>iy(d.dt)).reduce((t,d)=>t+Number(d.amt),0);if(dep>0)fr('🐷','¥'+dep.toFixed(0),'存进了存钱罐','');
 return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${yrs.map(y=>`<button class="btn ${y===Y?'':'o'}" onclick="yrSel='${y}';render()">${y}</button>`).join('')}</div><h3 style="text-align:center">🎬 ${Y} 年度胶片</h3>`+(F.length?F.join(''):'<p class="mut" style="text-align:center;padding:30px 0">这一年还没有可回顾的记录</p>');
}
function mapTap(e){
 if(!placing)return;
 const r=e.currentTarget.getBoundingClientRect();
 const x=+((e.clientX-r.left)/r.width*100).toFixed(1),y=+((e.clientY-r.top)/r.height*100).toFixed(1);
 const p=placing;placing=null;
 if(p==='new')openForm('food',null,{x,y});else{save(p,{...items[p],x,y})}
}
function selPin(id){
 if(foodFull){sel=id;drawMarkers();showFD(id);const v=items[id];if(amap&&v&&v.lng!=null){try{const b=amap.getBounds(),sp=b.getNorthEast().lat-b.getSouthWest().lat;amap.setCenter([v.lng,v.lat-sp*.18])}catch(e){amap.setCenter([v.lng,v.lat])}}return}
sel=sel===id?null:id;render();const v=items[id];if(amap&&v&&v.lng!=null&&sel===id)amap.setCenter([v.lng,v.lat])}
function ate(id){save(id,{...items[id],kind:'吃过',date:td()}).then(()=>openForm('food',id))}
function mapBg(){
 const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{let w=1000,q=.7,u;const c=document.createElement('canvas');do{const s=Math.min(1,w/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);u=c.toDataURL('image/jpeg',q);w*=.85;q*=.9}while(u.length>200000&&w>300);save('mapbg',{img:u})};im.src=URL.createObjectURL(f)};
 i.click();
}

function loginView(){
 const pw=loginMode==='pw';
 return `<div class="card static"><h3>🎞️ 登录我们的日记</h3><label>邮箱</label><input id="lem" type="email" autocomplete="email" value="${esc(lastEmail)}">${pw?`<label>密码</label><input id="lpw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><p><button class="btn" onclick="login()">登录</button></p>`:`<p><button class="btn o" onclick="sendCode()">发送验证码到邮箱</button></p><label>邮箱里的验证码</label><input id="lcd" inputmode="numeric" autocomplete="one-time-code" onkeydown="if(event.key==='Enter')verifyCode()"><p><button class="btn" onclick="verifyCode()">验证并登录</button></p>`}<p class="mut"><a href="#" onclick="loginMode='${pw?'code':'pw'}';render();return false">${pw?'改用邮箱验证码登录':'改用密码登录'}</a></p></div>`;
}
function errMsg(j,r){return j.msg||j.error_description||j.message||('HTTP '+r.status)}
async function login(){
 if(!CONFIGURED){toast(warn||'尚未配置');return}
 const em=$('#lem').value.trim(),pw=$('#lpw').value;if(!em||!pw){toast('请输入邮箱和密码');return}
 toast('登录中…');
 try{await authReq('password',{email:em,password:pw});try{localStorage.setItem('lem',em)}catch(e){}apply(true)}
 catch(e){toast(e.name==='AbortError'?'连接 Supabase 超时，请检查网络':'登录失败：'+e.message)}
}
async function sendCode(){
 const em=$('#lem').value.trim();if(!em){toast('请先填邮箱');return}
 try{const r=await api('/auth/v1/otp',{method:'POST',body:JSON.stringify({email:em,create_user:false})});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(errMsg(j,r))}
  try{localStorage.setItem('lem',em)}catch(e){}toast('验证码已发送，请查看邮箱（也看看垃圾箱）')}
 catch(e){toast('发送失败：'+e.message)}
}
async function verifyCode(){
 const em=$('#lem').value.trim(),cd=$('#lcd').value.trim();if(!em||!cd){toast('请填写邮箱和验证码');return}
 try{const r=await api('/auth/v1/verify',{method:'POST',body:JSON.stringify({type:'email',email:em,token:cd})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(errMsg(j,r));
  tok={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000};saveTok();apply(true)}
 catch(e){toast('验证失败：'+e.message)}
}
function jwtInfo(){try{return JSON.parse(atob(tok.access.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(e){return {}}}
async function loadMembers(){
 try{MEM=(await rest('members?select=uid,name,email'))||[]}catch(e){MEM=[]}
 const j=tok?jwtInfo():{};
 ME=MEM.find(m=>m.uid===j.sub)||(MEM.length?null:{uid:j.sub,name:(j.email||'我').split('@')[0],email:j.email});
 if(ME&&!ME.email)ME.email=j.email;
 memLoaded=true;
}
async function logout(){
 if(!confirm('确定退出登录吗？'))return;
 try{const h=await bearer();api('/auth/v1/logout',{method:'POST',headers:h})}catch(e){}
 tok=null;saveTok();try{localStorage.removeItem('amcfg')}catch(e){}apply(false);
}

async function setPw(pw){
 const h=await bearer();
 const r=await api('/auth/v1/user',{method:'PUT',headers:h,body:JSON.stringify({password:pw})});
 if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.msg||j.message||('HTTP '+r.status))}
}
function pwForm(){

 $('#dlg').showModal();

async function pwSubmit(){
 const a=$('#np1').value;if(a.length<8){toast('至少 8 位');return}

 try{await setPw(a);$('#dlg').close();toast('密码已修改')}catch(e){toast('修改失败：'+(e.message||e.code))}
}

(()=>{
 const inMap=e=>e.target&&e.target.closest&&e.target.closest('#fslot,#fsslot,#mapslot,#ffslot');
 ['touchstart','touchmove'].forEach(ev=>document.addEventListener(ev,e=>{if(inMap(e)){touching=true;clearTimeout(touchTm)}},{passive:true,capture:true}));
 ['touchend','touchcancel'].forEach(ev=>document.addEventListener(ev,e=>{if(e.touches&&e.touches.length)return;touching=false;touchEndT=Date.now();if(pend)setTimeout(()=>{if(pend&&!touching){pend=false;render()}},300)},{passive:true,capture:true}));
 ['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>{if(inMap(e))e.preventDefault()},{passive:false}));
